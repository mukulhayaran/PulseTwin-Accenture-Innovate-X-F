# Render Blueprint -- the backend API only (ADR-052). The frontend is a Vercel static
# export; Redis, MQTT and the ingestion bridge are NOT deployed to the cloud (serve/ never
# imports redis, the free tier has no background workers, and ingestion has no MQTT
# TLS/auth) -- they stay on the local `make up` stack, and /api/health reports them as
# "not_configured" here rather than pretending.
#
# Postgres is REQUIRED: PULSETWIN_REQUIRE_POSTGRES=1 makes a missing DATABASE_URL a startup
# failure instead of a silent fallback to the read-only SQLite build artifact. Use Neon's
# DIRECT connection string (host WITHOUT "-pooler"; it already carries ?sslmode=require).
#
# The free instance sleeps after 15 min idle; the first request after that takes ~1 min.
# See docs/PRODUCTION_ARCHITECTURE.md §DEPLOY.
services:
  - type: web
    name: pulsetwin-backend
    runtime: docker
    dockerfilePath: ./serve/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon direct connection string, pasted in the dashboard
      - key: PULSETWIN_REQUIRE_POSTGRES
        value: "1"
      - key: PULSETWIN_PG_POOL_MAX
        value: "5"
      - key: PULSETWIN_CORS_ORIGINS
        sync: false          # the Vercel URL, e.g. https://pulsetwin.vercel.app
      - key: PULSETWIN_GENAI_API_KEY
        sync: false          # OpenRouter key for the copilot; optional -- without it the
                             # copilot answers on its deterministic, no-LLM path
