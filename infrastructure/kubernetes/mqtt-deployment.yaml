# PulseTwin MQTT broker — Deployment + Service + ConfigMap
#
# Mirrors docker-compose.prod.yml's `mqtt` service (eclipse-mosquitto:2, port 1883,
# config mounted from infrastructure/mosquitto.conf). The ConfigMap `data` block below is
# a byte-for-byte copy of that file so this manifest can never silently drift from what
# the demo actually runs — if you edit infrastructure/mosquitto.conf, update this too.
#
# infrastructure/mosquitto.conf's own header is explicit that this is a DEMO posture:
# plaintext 1883, `allow_anonymous true`, no ACL file. Production posture (per that same
# file's comment, echoing docs/ARCHITECTURE.md) is TLS-only on 8883, per-device client
# certs, and an ACL restricting each edge gateway to its own plant/zone topic prefix.
# None of that is stood up here, on purpose — replicating this is more useful than a demo
# CA that only looks more secure than the plaintext version.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulsetwin-mosquitto-config
  namespace: pulsetwin
  labels:
    app.kubernetes.io/part-of: pulsetwin
    app.kubernetes.io/component: mqtt
data:
  mosquitto.conf: |
    # Demo-posture Mosquitto config: plaintext MQTT on the default port, no auth.
    #
    # Production posture (docs/SECURITY.md / docs/PRODUCTION_ARCHITECTURE.md): the broker sits
    # on the OT side of the DMZ, TLS-only (port 8883), with per-device client certificates and
    # an ACL file restricting each edge gateway to publishing under its own plant/zone prefix
    # only. None of that is needed to demonstrate the ingestion pipeline locally, and standing
    # up a demo CA would be theatre -- the architecture doc says so explicitly rather than
    # shipping a fake TLS setup that looks more secure than it is.

    listener 1883
    allow_anonymous true
    persistence false
    log_dest stdout

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsetwin-mqtt
  namespace: pulsetwin
  labels:
    app.kubernetes.io/name: pulsetwin-mqtt
    app.kubernetes.io/part-of: pulsetwin
    app.kubernetes.io/component: mqtt
spec:
  replicas: 1   # configs/deployment.yaml services.mqtt.replicas — single broker, demo-only
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsetwin-mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsetwin-mqtt
        app.kubernetes.io/part-of: pulsetwin
        app.kubernetes.io/component: mqtt
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
          resources:
            # configs/deployment.yaml services.mqtt.resources — exact match.
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      volumes:
        - name: mosquitto-config
          configMap:
            name: pulsetwin-mosquitto-config

---
# ClusterIP: reachable only from inside the namespace, and per network-policy.yaml only
# pulsetwin-ingestion's egress rule permits reaching port 1883 here — this is the OT-side
# boundary of the cluster.
apiVersion: v1
kind: Service
metadata:
  name: pulsetwin-mqtt
  namespace: pulsetwin
  labels:
    app.kubernetes.io/name: pulsetwin-mqtt
    app.kubernetes.io/part-of: pulsetwin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pulsetwin-mqtt
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      protocol: TCP
