# ClusterIP Service fronting the backend Deployment's 2 (autoscaled to 6) pods.
# Internal-only: judged production posture routes external traffic through an ingress /
# load balancer in front of this, not covered here since the demo serves the frontend as
# a static export (see docker-compose.prod.yml) rather than proxying through Kubernetes.
apiVersion: v1
kind: Service
metadata:
  name: pulsetwin-backend
  namespace: pulsetwin
  labels:
    app.kubernetes.io/name: pulsetwin-backend
    app.kubernetes.io/part-of: pulsetwin
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pulsetwin-backend
  ports:
    - name: http
      port: 7860
      targetPort: 7860
      protocol: TCP
