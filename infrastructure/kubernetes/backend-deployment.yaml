# PulseTwin backend — Deployment + its ConfigMap/Secret
#
# Numbers here are pulled verbatim from configs/deployment.yaml (services.backend) so
# there is exactly one source of truth for "how many replicas / how much CPU". If you
# change one, change both, or add an ADR explaining the drift.
#
# Image is built from serve/Dockerfile (see docker-compose.prod.yml's `backend` service
# for the equivalent Compose build). `pulsetwin/backend:latest` below is a placeholder —
# a real rollout would push a content-addressed tag (git SHA or semver) from CI, never
# `:latest`, but this manifest is not applied to a live cluster for the hackathon demo.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsetwin-backend
  namespace: pulsetwin
  labels:
    app.kubernetes.io/name: pulsetwin-backend
    app.kubernetes.io/part-of: pulsetwin
    app.kubernetes.io/component: api
spec:
  replicas: 2   # configs/deployment.yaml services.backend.replicas.min
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsetwin-backend
  strategy:
    # configs/deployment.yaml rollout: RollingUpdate, max_surge 1, max_unavailable 0 —
    # never drop below the replica count mid-rollout, this is a live production API.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsetwin-backend
        app.kubernetes.io/part-of: pulsetwin
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: backend
          # Built from serve/Dockerfile. Replace with a registry-qualified, immutable tag
          # (e.g. ghcr.io/pulsetwin/backend:<git-sha>) before this ever reaches a real cluster.
          image: pulsetwin/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7860
              protocol: TCP
          env:
            - name: MQTT_BROKER
              valueFrom:
                configMapKeyRef:
                  name: pulsetwin-config
                  key: MQTT_BROKER
            - name: MQTT_PORT
              valueFrom:
                configMapKeyRef:
                  name: pulsetwin-config
                  key: MQTT_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulsetwin-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: pulsetwin-secrets
                  key: REDIS_URL
          resources:
            # configs/deployment.yaml services.backend.resources — exact match.
            requests:
              cpu: "250m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            # configs/deployment.yaml services.backend.probes.liveness
            httpGet:
              path: /api/health
              port: 7860
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            # configs/deployment.yaml services.backend.probes.readiness
            httpGet:
              path: /api/health
              port: 7860
            initialDelaySeconds: 5
            periodSeconds: 5
      restartPolicy: Always

---
# Non-secret backend/ingestion config: broker host + port only. Anything that can embed
# credentials (DATABASE_URL, REDIS_URL) goes in the Secret below instead — see CLAUDE.md
# SS3 "sourced economics" / operator-privacy conventions for why this repo is fussy about
# never letting a sensitive value ride along with a non-sensitive one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulsetwin-config
  namespace: pulsetwin
  labels:
    app.kubernetes.io/part-of: pulsetwin
data:
  MQTT_BROKER: "pulsetwin-mqtt"
  MQTT_PORT: "1883"

---
# Placeholder secret. Values below are NOT real credentials — this manifest is never
# applied to a live cluster (Docker Compose is the actual demo runtime; see CLAUDE.md).
# In a real rollout these would be populated by a secret manager (AWS Secrets Manager /
# External Secrets Operator) at deploy time, never checked in with real values.
#
# This is the single canonical `pulsetwin-secrets` object for the whole namespace —
# postgres-statefulset.yaml's POSTGRES_USER/POSTGRES_PASSWORD env vars read the same
# Secret by key rather than declaring a second `Secret/pulsetwin-secrets`, since two
# manifests defining the same named object would silently overwrite each other on apply.
apiVersion: v1
kind: Secret
metadata:
  name: pulsetwin-secrets
  namespace: pulsetwin
  labels:
    app.kubernetes.io/part-of: pulsetwin
type: Opaque
data:
  # echo -n 'postgresql://pulsetwin:<password>@pulsetwin-postgres:5432/pulsetwin' | base64
  DATABASE_URL: PGJhc2U2NC1lbmNvZGVkLWRhdGFiYXNlLXVybD4=   # <base64-encoded-database-url>
  # echo -n 'redis://pulsetwin-redis:6379' | base64
  REDIS_URL: PGJhc2U2NC1lbmNvZGVkLXJlZGlzLXVybD4=          # <base64-encoded-redis-url>
  # echo -n 'pulsetwin' | base64
  POSTGRES_USER: PGJhc2U2NC1lbmNvZGVkLXBvc3RncmVzLXVzZXI+   # <base64-encoded-postgres-user>
  # echo -n '<strong-generated-password>' | base64
  POSTGRES_PASSWORD: PGJhc2U2NC1lbmNvZGVkLXBvc3RncmVzLXBhc3N3b3JkPg==   # <base64-encoded-postgres-password>
