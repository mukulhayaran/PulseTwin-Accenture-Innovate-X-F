# PulseTwin OT/IT network segmentation
#
# This file is the enforcement layer for the boundary documented in
# configs/deployment.yaml's `network:` section and docs/ARCHITECTURE.md:
#
#   network:
#     ot_it_bridge_pod: ingestion
#     backend_allowed_egress: [postgres, redis]
#     frontend_allowed_egress: [backend]
#     internet_egress_allowed: false
#
# The story in one sentence: pulsetwin-ingestion is the ONLY pod in the namespace
# allowed to talk to the MQTT broker (the OT side — assembly-line PLCs/edge gateways
# publish sensor readings there); pulsetwin-backend, which serves the three persona UIs
# and is reachable from wherever the frontend/API consumers sit, can reach the IT-side
# data stores (Postgres, Redis) but is architecturally forbidden from reaching MQTT
# directly. That asymmetry is the actual security control: even if the backend process
# were fully compromised (arbitrary code execution via a dependency, a bad request
# handler, whatever), NetworkPolicy — enforced by the CNI, not by application code —
# means it cannot open a connection to the OT network. Only one narrow, purpose-built
# process can, and that process makes no outbound network calls of its own besides the
# three destinations named for it below.
#
# Policy layering: policy 1 is a namespace-wide default-deny for egress. Policies 2-3
# layer a narrow egress allow list on top of ingestion and backend respectively; policies
# 4-5 layer ingress allow lists on top of the data stores and the broker (NetworkPolicy
# semantics: once ANY policy selects a pod for a direction, that direction is deny by
# default except for what selecting policies explicitly allow, and multiple policies for
# the same pod combine additively). DNS (port 53 to CoreDNS/kube-dns) gets its own
# exception in every egress policy that needs it, because default-deny-all-egress
# otherwise also blocks DNS resolution of Service names, which silently breaks everything
# downstream. pulsetwin-mqtt gets no egress policy of its own: it is a pure TCP listener
# with no outbound calls to make (not even DNS), so policy 1's default-deny-all leaves it
# with zero egress and that is exactly correct for a broker.
#
# Assumption: the frontend is served as a static export outside this namespace (see
# repo-root docker-compose.prod.yml's `frontend` service and CLAUDE.md SS7), not as a pod
# inside `pulsetwin` — so there is no frontend NetworkPolicy here. If a future revision
# containerizes the frontend inside this cluster, it would need: egress limited to
# pulsetwin-backend:7860 + DNS, and pulsetwin-backend would need an Ingress-side
# NetworkPolicy scoping who may call port 7860 (not present below — this file does not
# restrict ingress to pulsetwin-backend at all, since the demo has no in-cluster caller to
# name yet; adding that restriction once a real caller exists is a natural next step, not
# a gap being hidden).

---
# 1. Default deny all egress, namespace-wide.
#    Air-gapped posture: configs/deployment.yaml network.internet_egress_allowed: false.
#    Applies to every pod in `pulsetwin` (empty podSelector matches all pods). Ingress is
#    intentionally left alone by this policy — only egress is default-denied here; see
#    policies 4-5 for the ingress restrictions this file adds (postgres/redis, mqtt).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-egress
  namespace: pulsetwin
  labels:
    app.kubernetes.io/part-of: pulsetwin
    pulsetwin.io/policy-role: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress: []   # deny everything; more specific policies below layer allows on top

---
# 2. pulsetwin-ingestion: the ONE pod allowed to reach MQTT (OT side), plus Postgres and
#    Redis (IT side) to persist what it ingests. This is the OT/IT bridge — the only
#    place in the whole namespace those two worlds are allowed to touch.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingestion-egress
  namespace: pulsetwin
  labels:
    app.kubernetes.io/part-of: pulsetwin
    pulsetwin.io/policy-role: ot-it-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pulsetwin-ingestion
  policyTypes:
    - Egress
  egress:
    # OT side: the MQTT broker only. No other pod in this namespace gets this rule.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pulsetwin-mqtt
      ports:
        - protocol: TCP
          port: 1883
    # IT side: persist ingested readings.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pulsetwin-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pulsetwin-redis
      ports:
        - protocol: TCP
          port: 6379
    # DNS, or none of the podSelector-based egress above can resolve Service names.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# 3. pulsetwin-backend: Postgres + Redis only. Explicitly NEVER mqtt — the backend serves
#    the supervisor/manager/leadership UIs over HTTP and has no legitimate reason to open
#    a connection to the OT network. There is no egress rule to pulsetwin-mqtt anywhere in
#    this policy, which is the point: it is absent by omission, not by an explicit deny
#    (NetworkPolicy has no "deny" verb — omission from every allow-list IS the deny, via
#    policy 1's default).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
  namespace: pulsetwin
  labels:
    app.kubernetes.io/part-of: pulsetwin
    pulsetwin.io/policy-role: it-side-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pulsetwin-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pulsetwin-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pulsetwin-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# 4. Ingress lockdown for the data stores: only ingestion and backend may open
#    connections to Postgres/Redis; only ingestion may open a connection to MQTT. This is
#    the ingress-side mirror of policies 2-3 — an egress allow-list alone still lets any
#    pod that ISN'T egress-restricted (there are none such in this namespace today, but a
#    future addition could be) reach these stores unless ingress is also scoped. Naming
#    ingestion AND backend as the only allowed clients of postgres/redis, and ingestion
#    alone for mqtt, mirrors configs/deployment.yaml's `network.backend_allowed_egress`
#    and `ot_it_bridge_pod` fields exactly. No per-port restriction is applied here (the
#    rule allows the named source pods on any port of postgres/redis) because postgres
#    and redis listen on different ports (5432/6379) and Kubernetes NetworkPolicy has no
#    per-target-in-a-selector-group port syntax; the caller identity is the actual control
#    here, and each store's own egress-side policy (2, 3) already constrains which port
#    each caller ever dials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: datastore-ingress
  namespace: pulsetwin
  labels:
    app.kubernetes.io/part-of: pulsetwin
    pulsetwin.io/policy-role: datastore-lockdown
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - pulsetwin-postgres
          - pulsetwin-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pulsetwin-ingestion
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pulsetwin-backend

---
# 5. Ingress lockdown for the broker: only pulsetwin-ingestion may open a connection to
#    MQTT on port 1883. Paired with policy 2's egress rule, this makes the OT/IT bridge a
#    two-sided guarantee — ingestion is the only pod that can reach mqtt, AND mqtt is
#    reachable from no other pod, so even a second, unrelated pod added to this namespace
#    later would need an explicit policy change (not just a label change) to reach the
#    broker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mqtt-ingress
  namespace: pulsetwin
  labels:
    app.kubernetes.io/part-of: pulsetwin
    pulsetwin.io/policy-role: ot-broker-lockdown
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pulsetwin-mqtt
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pulsetwin-ingestion
      ports:
        - protocol: TCP
          port: 1883
