# PulseTwin ingestion bridge — Deployment
#
# Fixed at 1 replica. This is deliberate, not an oversight: configs/deployment.yaml
# says it plainly —
#
#   replicas: { min: 1, max: 1 }   # one subscriber per broker connection; scaling this
#     needs MQTT shared subscriptions ($share/), tracked as a backlog item, not built
#     for the demo
#
# Because this is the ONE pod in the whole namespace allowed to reach the MQTT broker
# (see network-policy.yaml — the OT/IT bridge), running more than one replica without
# shared subscriptions would mean every MQTT message gets delivered to every replica,
# multiplying ingested readings. Do not raise `replicas` here without first implementing
# `$share/` support in ingestion/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsetwin-ingestion
  namespace: pulsetwin
  labels:
    app.kubernetes.io/name: pulsetwin-ingestion
    app.kubernetes.io/part-of: pulsetwin
    app.kubernetes.io/component: ingestion
spec:
  replicas: 1   # configs/deployment.yaml services.ingestion.replicas.max — hard cap, see above
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsetwin-ingestion
  strategy:
    # Recreate, not RollingUpdate: with exactly one MQTT subscriber allowed, a surge pod
    # during a rolling update would be a second concurrent subscriber to the same topics.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsetwin-ingestion
        app.kubernetes.io/part-of: pulsetwin
        app.kubernetes.io/component: ingestion
    spec:
      containers:
        - name: ingestion
          # Built from ingestion/Dockerfile (see docker-compose.prod.yml `ingestion` service).
          image: pulsetwin/ingestion:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MQTT_BROKER
              valueFrom:
                configMapKeyRef:
                  name: pulsetwin-config
                  key: MQTT_BROKER
            - name: MQTT_PORT
              valueFrom:
                configMapKeyRef:
                  name: pulsetwin-config
                  key: MQTT_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulsetwin-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: pulsetwin-secrets
                  key: REDIS_URL
          resources:
            # configs/deployment.yaml services.ingestion.resources — exact match.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          # No liveness/readiness probe configured. ingestion is a headless MQTT-to-DB
          # bridge with no HTTP server to poll (unlike the backend, it exposes no port at
          # all — see docker-compose.prod.yml, which gives it no `ports:` entry either).
          # An `exec` probe that merely checks the interpreter is still alive (e.g.
          # `python -c "import sys"`) would always pass and catch nothing more than
          # kubelet's own crash-restart already does, so it is deliberately omitted rather
          # than included as theatre. A production version would have
          # ingestion/mqtt_subscriber.py expose a small `/healthz` port (last-message
          # timestamp + broker connection state) purely for kubelet to probe — tracked as
          # a backlog item alongside the `$share/` scaling work noted above. Until then,
          # Kubernetes' default restart-on-crash policy is the only safety net.
      restartPolicy: Always
