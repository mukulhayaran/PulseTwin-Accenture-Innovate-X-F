# PulseTwin — namespace
#
# All PulseTwin workloads (backend, ingestion, postgres, redis, mqtt) live in this one
# namespace so the NetworkPolicy set in network-policy.yaml can reason about a single,
# bounded pod population. See configs/deployment.yaml for the numbers these manifests
# are written from, and docs/ARCHITECTURE.md for the OT/IT boundary this namespace sits
# inside of.
apiVersion: v1
kind: Namespace
metadata:
  name: pulsetwin
  labels:
    app.kubernetes.io/part-of: pulsetwin
    app.kubernetes.io/managed-by: manual
    environment: production
    pulsetwin.io/network-posture: air-gapped
