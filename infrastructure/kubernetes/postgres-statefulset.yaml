# PulseTwin postgres — StatefulSet + headless Service
#
# This is a single-node StatefulSet purely for demo-parity with docker-compose.prod.yml
# (same image, same db/user/password, same port). It intentionally does NOT represent
# the recommended production topology: docs/ARCHITECTURE.md and configs/deployment.yaml
# (services.postgres comment) both call out that a real deployment would point DATABASE_URL
# at a managed, multi-AZ Postgres (AWS RDS / GCP Cloud SQL — see
# infrastructure/terraform/main.tf's aws_db_instance) instead of running Postgres as a
# pod at all. A hand-rolled single replica has no automatic failover and loses its PVC's
# availability zone in an outage; it is here only so the Kubernetes manifests can stand
# up an end-to-end namespace that mirrors the Compose demo.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pulsetwin-postgres
  namespace: pulsetwin
  labels:
    app.kubernetes.io/name: pulsetwin-postgres
    app.kubernetes.io/part-of: pulsetwin
    app.kubernetes.io/component: database
spec:
  serviceName: pulsetwin-postgres
  replicas: 1   # configs/deployment.yaml services.postgres.replicas — single-node, demo-only
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsetwin-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsetwin-postgres
        app.kubernetes.io/part-of: pulsetwin
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: pulsetwin
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pulsetwin-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsetwin-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            # configs/deployment.yaml services.postgres.resources — exact match.
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pulsetwin"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "pulsetwin"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/part-of: pulsetwin
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # configs/deployment.yaml services.postgres.storage_gb: 20
            storage: 20Gi

---
# Headless Service: required by StatefulSet for stable per-pod DNS
# (pulsetwin-postgres-0.pulsetwin-postgres.pulsetwin.svc.cluster.local), and is what
# `DATABASE_URL` in pulsetwin-secrets should resolve against.
apiVersion: v1
kind: Service
metadata:
  name: pulsetwin-postgres
  namespace: pulsetwin
  labels:
    app.kubernetes.io/name: pulsetwin-postgres
    app.kubernetes.io/part-of: pulsetwin
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: pulsetwin-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

# Note: POSTGRES_USER / POSTGRES_PASSWORD above read from the `pulsetwin-secrets` Secret
# defined once, canonically, in backend-deployment.yaml (which also carries DATABASE_URL
# and REDIS_URL). Apply that file before this one — kubectl apply -f
# infrastructure/kubernetes/ applies the whole directory together so ordering by filename
# does not matter in practice.
