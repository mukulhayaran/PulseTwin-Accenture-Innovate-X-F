# PulseTwin — Prometheus scrape config
#
# Finals brief SS5 anti-pattern: "do not build a Grafana dashboard that runs in the demo."
# This file exists to show the scrape side is thought through; it is never started as
# part of `make demo` or docker-compose.prod.yml. The Ops view (frontend/app/ops/page.tsx)
# is the in-demo substitute -- it reads the same underlying numbers straight from the API
# (GET /api/system/health, /api/model/health) rather than through Prometheus.
#
# serve/metrics.py defines the pulsetwin_* series scraped here; app.instrument(app) via
# prometheus-fastapi-instrumentator (serve/main.py) adds the generic http_request_* series
# alongside them on the same /metrics endpoint -- one scrape target, two families.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: pulsetwin

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pulsetwin-backend
    metrics_path: /metrics
    static_configs:
      # Docker Compose service name (docker-compose.prod.yml's `backend` service, port
      # 7860). A Kubernetes deployment would instead use a ServiceMonitor / pod annotation
      # discovery against infrastructure/kubernetes/backend-service.yaml -- static_configs
      # is the honest choice for what this repo's actual demo runtime is.
      - targets: ["backend:7860"]
        labels:
          component: api

# Alerting thresholds mirror numbers already decided elsewhere in this repo rather than
# inventing new ones: 5s ingestion lag threshold (serve/routers/system.py's
# `threshold_s: 5.0`), PSI > 0.2 (mlops/drift_detector.py's "significant shift"
# threshold, docs/MLOPS_LIFECYCLE.md), and the alarm budget from
# configs/economics.yaml's alarm_budget.max_alerts_per_shift.
