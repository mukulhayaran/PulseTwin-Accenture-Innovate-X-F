# Demo-posture Mosquitto config: plaintext MQTT on the default port, no auth.
#
# Production posture (docs/SECURITY.md / docs/PRODUCTION_ARCHITECTURE.md): the broker sits
# on the OT side of the DMZ, TLS-only (port 8883), with per-device client certificates and
# an ACL file restricting each edge gateway to publishing under its own plant/zone prefix
# only. None of that is needed to demonstrate the ingestion pipeline locally, and standing
# up a demo CA would be theatre -- the architecture doc says so explicitly rather than
# shipping a fake TLS setup that looks more secure than it is.

listener 1883
allow_anonymous true
persistence false
log_dest stdout
