# The full stack: Postgres + Redis + MQTT + the ingestion bridge + the API + the UI.
# Postgres is REQUIRED (ADR-052): the backend refuses to start without DATABASE_URL, so this
# stack can never silently serve the read-only SQLite build artifact. The cloud deploy
# (render.yaml + Vercel) runs the backend and frontend only; Redis, MQTT and ingestion
# stay here. See docs/PRODUCTION_ARCHITECTURE.md.
#
#   make up        # docker compose -f docker-compose.prod.yml up --build
#   make down      # docker compose -f docker-compose.prod.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsetwin
      POSTGRES_USER: pulsetwin
      POSTGRES_PASSWORD: pulsetwin_dev
    ports:
      # Host-side 5433, not 5432: some dev machines already run a native Postgres service
      # on 5432 (a real collision hit during this build). Only the host mapping changes --
      # every in-network service (backend, ingestion, migrate) still reaches Postgres at
      # `postgres:5432`, unaffected.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsetwin"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto.conf:/mosquitto/config/mosquitto.conf

  migrate:
    build:
      context: .
      dockerfile: serve/Dockerfile
    command: ["python", "-m", "migrations.migrate"]
    environment:
      DATABASE_URL: postgresql://pulsetwin:pulsetwin_dev@postgres:5432/pulsetwin
    depends_on:
      postgres:
        condition: service_healthy

  load-data:
    build:
      context: .
      dockerfile: offline/Dockerfile.loader
    environment:
      DATABASE_URL: postgresql://pulsetwin:pulsetwin_dev@postgres:5432/pulsetwin
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: serve/Dockerfile
    # The GenAI provider key (PULSETWIN_GENAI_API_KEY) and model settings, from the
    # gitignored .env.local, so the agents always run on the real model. Optional: without
    # the file the backend still starts, in the no-LLM deterministic mode, and logs so.
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://pulsetwin:pulsetwin_dev@postgres:5432/pulsetwin
      REDIS_URL: redis://redis:6379
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      FRONTEND_HEALTH_URL: http://frontend:3000
      PULSETWIN_REQUIRE_POSTGRES: "1"
      # ADR-063: roles come only from server-issued demo sessions; a bare role header can
      # no longer claim one. Still NOT production auth.
      PULSETWIN_AUTH_MODE: session
      # Login passwords. REQUIRE_POSTGRES=1 above makes the backend refuse the committed
      # dev passwords, so this LOCAL stack passes them in explicitly; override any of them
      # from the shell or a .env file. The cloud deploy (render.yaml) has no defaults.
      PULSETWIN_PASSWORD_SUPERVISOR: ${PULSETWIN_PASSWORD_SUPERVISOR:-sup2026}
      PULSETWIN_PASSWORD_MANAGER: ${PULSETWIN_PASSWORD_MANAGER:-mgr2026}
      PULSETWIN_PASSWORD_LEADERSHIP: ${PULSETWIN_PASSWORD_LEADERSHIP:-lead2026}
      PULSETWIN_PASSWORD_SYSTEM: ${PULSETWIN_PASSWORD_SYSTEM:-sys2026}
      # ADR-064: job heartbeats, logs and the provider capability cache. On a volume so a
      # redeploy does not forget the provider's request shape -- every fresh cache spent
      # an extra AI request per run rediscovering it.
      PULSETWIN_JOBS_DIR: /var/lib/pulsetwin/jobs
    volumes:
      - pulsetwin_jobs:/var/lib/pulsetwin/jobs
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      load-data:
        condition: service_completed_successfully
    # One volume (above): the jobs directory. Feedback lives in Postgres (migrations/016).
    # The ./data and ./artifacts mounts existed for retraining (ADR-053); the image
    # already carries artifacts/.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:7860/api/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      DATABASE_URL: postgresql://pulsetwin:pulsetwin_dev@postgres:5432/pulsetwin
      REDIS_URL: redis://redis:6379
    depends_on:
      mqtt:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      load-data:
        condition: service_completed_successfully

  # Optional deterministic edge feed. It uses the exact MQTT path a future OPC-UA/MES
  # gateway uses, while remaining honestly labelled as synthetic data in every payload.
  publisher:
    profiles: ["mqtt-demo"]
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    command: ["python", "-m", "ingestion.mqtt_publisher", "--plant-id", "plant_a", "--speed", "10"]
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
    depends_on:
      mqtt:
        condition: service_started
      ingestion:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pulsetwin_jobs:
  pgdata:
