# Production-shaped stack: Postgres + Redis + MQTT + the ingestion bridge + the API.
# `docker-compose.yml` (no suffix) stays the lightweight SQLite demo runtime; this file is
# what an enterprise IT team would actually run. See docs/PRODUCTION_ARCHITECTURE.md.
#
#   make demo-prod        # docker compose -f docker-compose.prod.yml up --build
#   make demo-prod-down   # docker compose -f docker-compose.prod.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsetwin
      POSTGRES_USER: pulsetwin
      POSTGRES_PASSWORD: pulsetwin_dev
    ports:
      # Host-side 5433, not 5432: some dev machines already run a native Postgres service
      # on 5432 (a real collision hit during this build). Only the host mapping changes --
      # every in-network service (backend, ingestion, migrate) still reaches Postgres at
      # `postgres:5432`, unaffected.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsetwin"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto.conf:/mosquitto/config/mosquitto.conf

  migrate:
    build:
      context: .
      dockerfile: serve/Dockerfile
    command: ["python", "-m", "migrations.migrate"]
    environment:
      DATABASE_URL: postgresql://pulsetwin:pulsetwin_dev@postgres:5432/pulsetwin
    depends_on:
      postgres:
        condition: service_healthy

  load-data:
    build:
      context: .
      dockerfile: offline/Dockerfile.loader
    environment:
      DATABASE_URL: postgresql://pulsetwin:pulsetwin_dev@postgres:5432/pulsetwin
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: serve/Dockerfile
    environment:
      DATABASE_URL: postgresql://pulsetwin:pulsetwin_dev@postgres:5432/pulsetwin
      REDIS_URL: redis://redis:6379
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      FRONTEND_HEALTH_URL: http://frontend:3000
      PULSETWIN_FEEDBACK_DB: /data/pulsetwin_feedback.db
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      load-data:
        condition: service_completed_successfully
    volumes:
      - backend_state:/data
      # Retraining reads synthetic source data and atomically writes a candidate model;
      # triage reads the same committed artifact snapshot as the API.
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:7860/api/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      DATABASE_URL: postgresql://pulsetwin:pulsetwin_dev@postgres:5432/pulsetwin
      REDIS_URL: redis://redis:6379
    depends_on:
      mqtt:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      load-data:
        condition: service_completed_successfully

  # Optional deterministic edge feed. It uses the exact MQTT path a future OPC-UA/MES
  # gateway uses, while remaining honestly labelled as synthetic data in every payload.
  publisher:
    profiles: ["mqtt-demo"]
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    command: ["python", "-m", "ingestion.mqtt_publisher", "--plant-id", "plant_a", "--speed", "10"]
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
    depends_on:
      mqtt:
        condition: service_started
      ingestion:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  backend_state:
