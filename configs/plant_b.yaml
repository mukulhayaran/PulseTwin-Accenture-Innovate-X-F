  - {id: 8,  name: "Cab Floor Weld",          zone: body, nominal_cycle_s: 62.0, cycle_cv: 0.08, buffer_capacity_after: 4, sensor_tier: full,   sensors: [weld_current_a, vibration_mm_s],         mtbf_hours: 800,  repair_time_s: 720, variant_multipliers: {sedan: 1.00, suv: 1.06, truck: 1.13}}
