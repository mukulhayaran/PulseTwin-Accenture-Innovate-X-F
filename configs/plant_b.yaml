variants:
  - id: sedan
    name: "Sedan"
    base_mix_pct: 45
    tuesday_mix_pct: 30
  - id: suv
    name: "SUV"
    base_mix_pct: 35
    tuesday_mix_pct: 25
  - id: truck
    name: "Truck"
    base_mix_pct: 20
    tuesday_mix_pct: 45          # plant B's variant-mix trigger

shifts:
  - id: shift_a
    name: "Morning"
    start: "06:00"
    end: "14:00"
    operator_count: 16
    skill_distribution: {expert: 0.35, standard: 0.45, junior: 0.20}
  - id: shift_b
    name: "Afternoon"
    start: "14:00"
    end: "22:00"
    operator_count: 16
    skill_distribution: {expert: 0.25, standard: 0.50, junior: 0.25}
  - id: shift_c
    name: "Night"
    start: "22:00"
    end: "06:00"
    operator_count: 12
    skill_distribution: {expert: 0.15, standard: 0.45, junior: 0.40}

ambient:
  base_temperature_c: 29.0          # southern plant: hotter, more humid than plant A
  daily_amplitude_c: 8.0
  base_humidity_pct: 58.0
  humidity_high_days: [1, 2, 3]     # Tue, Wed, Thu
  humidity_high_add_pct: 16.0
  hvac_noise_sigma_pct: 4.0

operators:
  skill_torque_bias_pct: {expert: 0.5, standard: 0.0, junior: -2.8}
  skill_checklist_multiplier: {expert: 0.90, standard: 1.00, junior: 1.18}
  rotation_interval_units: 55
  operator_bucket_count: 8

defect_physics:
  mode_a:
    name: "Paint Micro-Blistering"
    weight: 0.40
    contributing_stations: [20, 21, 22]
    dwell_window: {from_station: 18, from_edge: exit, to_station: 20, to_edge: entry}
    dwell_threshold_s: 520.0
    dwell_nominal_s: 140.0
    humidity_threshold_pct: 62.0    # higher ambient baseline than plant A
    paint_batch_weak_fraction: 0.25
    paint_batch_change_interval_units: 180

  mode_b:
    name: "Surface Prep Adhesion Failure"
    weight: 0.35
    contributing_station: 19
    trigger: unblock_burst
    unblock_min_blocked_s: 55.0
    rush_units_after_unblock: [3, 6]
    checklist_rush_threshold_s: 27.0
    checklist_nominal_s: 48.0

  mode_c:
    name: "Structural Fastening Defect"
    weight: 0.25
    contributing_stations: [4, 11]
    torque_deficit_threshold_pct: 7.0
    vibration_excess_percentile: 90.0
    interaction_required: true

  bias: -3.476
  mode_scale: 2.60
  w_lot: 0.85
  w_noise: 0.50

  base_defect_rate: 0.03
  lot_quality_change_interval_units: 180

  label_noise_rate: 0.03
  inspection_detection_rate: 0.90
  inspection_false_reject_rate: 0.002
  inline_gate_s18: false

simulation:
  duration_days: 28
  seed: 43                          # different seed -- plant B is not a replay of plant A
  lot_change_interval_units: 180
  warmup_units: 250
  # WHOLE-WEEK SPLITS. The line starts on a Monday, so days 1-14 / 15-21 / 22-28 are
  # three complete weeks and EACH contains exactly one Tue/Wed peak pair. At 21 days
  # the test split was days 18-21 = Thu-Sun: no peak day at all, so it could not
  # evaluate the scenario the whole project is about, and held only 86 positives.
  train_days: [1, 14]
  validate_days: [15, 21]
  test_days: [22, 28]
  replay_window_hours: 24
  tool_wear_pct_per_hour: [0.1, 0.6]
