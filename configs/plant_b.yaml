  - {id: 14, name: "Closure Hang",            zone: body, nominal_cycle_s: 60.0, cycle_cv: 0.07, buffer_capacity_after: 5, sensor_tier: full,   sensors: [torque_nm, vibration_mm_s],              mtbf_hours: 1150, repair_time_s: 500, variant_multipliers: {sedan: 1.00, suv: 1.06, truck: 1.09}}
  - {id: 15, name: "Body Geometry Check",     zone: body, nominal_cycle_s: 51.0, cycle_cv: 0.05, buffer_capacity_after: 6, sensor_tier: full,   sensors: [torque_nm, vibration_mm_s],              mtbf_hours: 1700, repair_time_s: 360, variant_multipliers: {sedan: 1.00, suv: 1.03, truck: 1.05}}
  - {id: 16, name: "Body Completion",         zone: body, nominal_cycle_s: 70.0, cycle_cv: 0.08, buffer_capacity_after: 8, sensor_tier: full,   sensors: [weld_current_a, torque_nm, vibration_mm_s], mtbf_hours: 680, repair_time_s: 880, variant_multipliers: {sedan: 1.00, suv: 1.05, truck: 1.06}}

  # ---------------- PAINT SHOP (S17-S24) ----------------
  # Mode A dwell window: S18 exit -> S20 entry, spanning the manual S19.
  - {id: 17, name: "Paint Pre-Treatment",     zone: paint, nominal_cycle_s: 54.0, cycle_cv: 0.06, buffer_capacity_after: 6, sensor_tier: full,   sensors: [humidity_pct, temperature_c],                mtbf_hours: 1600, repair_time_s: 520, variant_multipliers: {sedan: 1.00, suv: 1.04, truck: 1.10}}
