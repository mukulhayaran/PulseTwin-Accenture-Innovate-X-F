  - {id: 19, name: "Paint Surface Prep",      zone: paint, nominal_cycle_s: 49.0, cycle_cv: 0.19, buffer_capacity_after: 2, sensor_tier: manual, sensors: [], checklist_nominal_s: 48.0,                mtbf_hours: 2000, repair_time_s: 240, variant_multipliers: {sedan: 1.00, suv: 1.06, truck: 1.14}, defect_role: mode_b_origin}
  - {id: 20, name: "Base Coat Application",   zone: paint, nominal_cycle_s: 62.0, cycle_cv: 0.06, buffer_capacity_after: 2, sensor_tier: full,   sensors: [humidity_pct, temperature_c, film_thickness_um], mtbf_hours: 920,  repair_time_s: 720, variant_multipliers: {sedan: 1.00, suv: 1.05, truck: 1.13}, defect_role: mode_a_contributor}
  - {id: 21, name: "Clear Coat Application",  zone: paint, nominal_cycle_s: 65.0, cycle_cv: 0.06, buffer_capacity_after: 2, sensor_tier: full,   sensors: [humidity_pct, temperature_c, film_thickness_um], mtbf_hours: 840,  repair_time_s: 760, variant_multipliers: {sedan: 1.00, suv: 1.05, truck: 1.13}, defect_role: mode_a_contributor}
  - {id: 22, name: "Cure Oven",               zone: paint, nominal_cycle_s: 68.0, cycle_cv: 0.04, buffer_capacity_after: 5, sensor_tier: full,  sensors: [humidity_pct, temperature_c, film_thickness_um], mtbf_hours: 1900, repair_time_s: 960, variant_multipliers: {sedan: 1.00, suv: 1.03, truck: 1.05}, defect_role: mode_a_contributor}
  - {id: 23, name: "Bed Liner Coat",          zone: paint, nominal_cycle_s: 56.0, cycle_cv: 0.09, buffer_capacity_after: 5, sensor_tier: full,   sensors: [humidity_pct, film_thickness_um],           mtbf_hours: 1100, repair_time_s: 480, variant_multipliers: {sedan: 0.70, suv: 0.85, truck: 1.25}}
  - {id: 24, name: "Legacy Paint Inspect",    zone: paint, nominal_cycle_s: 50.0, cycle_cv: 0.17, buffer_capacity_after: 4, sensor_tier: manual, sensors: [], checklist_nominal_s: 52.0,                mtbf_hours: 2000, repair_time_s: 260, variant_multipliers: {sedan: 1.00, suv: 1.04, truck: 1.12}}

  # ---------------- FINAL ASSEMBLY (S25-S42) ----------------
  - {id: 25, name: "Engine Mount",            zone: final, nominal_cycle_s: 61.0, cycle_cv: 0.08, buffer_capacity_after: 4, sensor_tier: full,   sensors: [torque_nm, vibration_mm_s], mtbf_hours: 900,  repair_time_s: 640, variant_multipliers: {sedan: 1.00, suv: 1.06, truck: 1.20}}
  - {id: 26, name: "Transmission Coupling",   zone: final, nominal_cycle_s: 58.0, cycle_cv: 0.08, buffer_capacity_after: 4, sensor_tier: full,   sensors: [torque_nm, vibration_mm_s], mtbf_hours: 980,  repair_time_s: 600, variant_multipliers: {sedan: 1.00, suv: 1.05, truck: 1.22}}
  - {id: 27, name: "Driveshaft Install",      zone: final, nominal_cycle_s: 55.0, cycle_cv: 0.07, buffer_capacity_after: 5, sensor_tier: full,   sensors: [torque_nm],                mtbf_hours: 1200, repair_time_s: 470, variant_multipliers: {sedan: 1.00, suv: 1.06, truck: 1.24}}
  - {id: 28, name: "Legacy Interior Fit",     zone: final, nominal_cycle_s: 57.0, cycle_cv: 0.16, buffer_capacity_after: 4, sensor_tier: manual, sensors: [], checklist_nominal_s: 44.0, mtbf_hours: 2000, repair_time_s: 300, variant_multipliers: {sedan: 1.00, suv: 1.08, truck: 1.15}}
  - {id: 29, name: "Rear Axle Mount",         zone: final, nominal_cycle_s: 60.0, cycle_cv: 0.08, buffer_capacity_after: 4, sensor_tier: full,   sensors: [torque_nm, vibration_mm_s], mtbf_hours: 940,  repair_time_s: 620, variant_multipliers: {sedan: 1.00, suv: 1.06, truck: 1.28}}
  - {id: 30, name: "Suspension Mount",        zone: final, nominal_cycle_s: 59.0, cycle_cv: 0.07, buffer_capacity_after: 5, sensor_tier: full,   sensors: [torque_nm, vibration_mm_s], mtbf_hours: 1080, repair_time_s: 540, variant_multipliers: {sedan: 1.00, suv: 1.07, truck: 1.26}, soft_sensor_validation: true}
  - {id: 31, name: "Frame Reinforcement Mount", zone: final, nominal_cycle_s: 64.0, cycle_cv: 0.10, buffer_capacity_after: 3, sensor_tier: full, sensors: [torque_nm, vibration_mm_s], mtbf_hours: 700,  repair_time_s: 880, variant_multipliers: {sedan: 1.00, suv: 1.05, truck: 1.50}}
  - {id: 32, name: "Bed Mount",               zone: final, nominal_cycle_s: 57.0, cycle_cv: 0.09, buffer_capacity_after: 4, sensor_tier: full,   sensors: [torque_nm],                mtbf_hours: 1000, repair_time_s: 560, variant_multipliers: {sedan: 0.70, suv: 0.85, truck: 1.32}}
  - {id: 33, name: "Legacy Towing Prep",      zone: final, nominal_cycle_s: 54.0, cycle_cv: 0.17, buffer_capacity_after: 4, sensor_tier: manual, sensors: [], checklist_nominal_s: 46.0, mtbf_hours: 2000, repair_time_s: 280, variant_multipliers: {sedan: 0.70, suv: 0.90, truck: 1.30}}
  - {id: 34, name: "Fuel System Install",     zone: final, nominal_cycle_s: 56.0, cycle_cv: 0.08, buffer_capacity_after: 5, sensor_tier: full,   sensors: [torque_nm],                mtbf_hours: 1150, repair_time_s: 500, variant_multipliers: {sedan: 1.00, suv: 1.05, truck: 1.29}}
  - {id: 35, name: "Wiring Harness",          zone: final, nominal_cycle_s: 58.0, cycle_cv: 0.09, buffer_capacity_after: 4, sensor_tier: full,   sensors: [torque_nm],                mtbf_hours: 1020, repair_time_s: 530, variant_multipliers: {sedan: 1.00, suv: 1.05, truck: 1.14}}
  - {id: 36, name: "Interior Trim",           zone: final, nominal_cycle_s: 60.0, cycle_cv: 0.10, buffer_capacity_after: 5, sensor_tier: full,   sensors: [torque_nm],                mtbf_hours: 1300, repair_time_s: 440, variant_multipliers: {sedan: 1.00, suv: 1.09, truck: 1.12}}
  - {id: 37, name: "Legacy Electrical Check", zone: final, nominal_cycle_s: 55.0, cycle_cv: 0.15, buffer_capacity_after: 4, sensor_tier: manual, sensors: [], checklist_nominal_s: 50.0, mtbf_hours: 2000, repair_time_s: 260, variant_multipliers: {sedan: 1.00, suv: 1.04, truck: 1.10}}
  - {id: 38, name: "Glass & Seals",           zone: final, nominal_cycle_s: 53.0, cycle_cv: 0.08, buffer_capacity_after: 4, sensor_tier: full,   sensors: [torque_nm, vibration_mm_s], mtbf_hours: 1400, repair_time_s: 420, variant_multipliers: {sedan: 1.00, suv: 1.07, truck: 1.09}}
  - {id: 39, name: "Fluid Fill",              zone: final, nominal_cycle_s: 51.0, cycle_cv: 0.06, buffer_capacity_after: 5, sensor_tier: full,   sensors: [torque_nm],                mtbf_hours: 1650, repair_time_s: 350, variant_multipliers: {sedan: 1.00, suv: 1.04, truck: 1.16}}
  - {id: 40, name: "Legacy Torque Audit",     zone: final, nominal_cycle_s: 52.0, cycle_cv: 0.16, buffer_capacity_after: 4, sensor_tier: manual, sensors: [], checklist_nominal_s: 55.0, mtbf_hours: 2000, repair_time_s: 240, variant_multipliers: {sedan: 1.00, suv: 1.05, truck: 1.13}}
  - {id: 41, name: "Wheel & Alignment",       zone: final, nominal_cycle_s: 63.0, cycle_cv: 0.07, buffer_capacity_after: 4, sensor_tier: full,   sensors: [torque_nm, vibration_mm_s], mtbf_hours: 880,  repair_time_s: 600, variant_multipliers: {sedan: 1.00, suv: 1.06, truck: 1.20}}
