# PulseTwin — Alert escalation policy
#
# Documents the escalation state machine that serve/routers/alerts_mgmt.py implements.
# serve/ reads the small containment_actions scalar block with a dependency-free parser;
# PyYAML remains outside the API import wall. These values are therefore the executable
# source of truth, not documentation that must be manually mirrored in Python.
#
# Operator privacy (CLAUDE.md SS3): every notification target below is a ROLE or a shift,
# never a named individual. No roster of real people is stored anywhere in this repo.

escalation:
  levels:
    - level: 1
      name: floor_supervisor
      trigger: alert_fired
      response_window_min: 5
      notify: { role: supervisor, channel: in_app }
    - level: 2
      name: shift_manager
      trigger: unacknowledged_after_level_1_window
      response_window_min: 15
      notify: { role: manager, channel: in_app_and_sms }
    - level: 3
      name: plant_leadership
      trigger: unacknowledged_after_level_2_window
      response_window_min: null   # stays open until acknowledged; no auto-close
      notify: { role: leadership, channel: in_app_and_email }

  containment_escalation:
    # A containment sweep (POST /api/trace/containment) that finds 3+ at-risk peer units
    # is treated as a lot-level event, not a single-unit alert, and skips straight to
    # level 2 -- waiting 5 minutes on a possible multi-unit lot issue is the wrong default.
    at_risk_threshold: 3
    skip_to_level: 2

  # Human action recommendations for related units, loaded at API startup.
  containment_actions:
    hold_risk: 0.50
    inspect_risk: 0.25

triage:
  # The autonomous triage rules GET /api/alerts/triage implements. Same arrangement as
  # `escalation` above: serve/ cannot parse yaml (the import wall), so these numbers are
  # hardcoded as constants in serve/routers/intelligence.py and THIS file is the
  # reviewable source an ops team would actually change. Keep the two in sync.
  #
  # The candidate set is deliberately WIDER than the alerts that fired. `alert_fired = 1`
  # means risk >= budget_threshold by construction, so triaging only those rows makes
  # severity a tautology and lands every unit in one class. The population is everything
  # above the cost-optimal inspection threshold -- roughly 1,400 units per plant against
  # ~100 fired -- because the gap between those two numbers IS the attention constraint
  # this system exists to manage.
  candidate_set: above_cost_threshold

  # Severity is expressed as a MULTIPLE of the plant's own alert threshold, read from
  # plant_meta at runtime, never written here. A raw probability means nothing across
  # plants; a multiple of the threshold the plant actually alerts at transfers unchanged.
  severity_x_threshold:
    critical: 1.25
    investigate: 1.00
    monitor: 0.75

  escalation_inputs:
    # Peers in the +/-30min containment window that are THEMSELVES above the alert
    # threshold. Mirrors containment_escalation.at_risk_threshold above.
    #
    # Note which peer measure this is. The containment panel's own list (same lot, or
    # risk above 0.6x threshold, capped at 12) saturates its cap for every unit in the
    # committed artifact, so escalating on it escalates everything. It is still reported,
    # for agreement with that panel, but it is not what triggers.
    peers_above_threshold: 3
    # Below this, a correct prediction is not actionable -- the unit reaches inspection
    # before anyone can intervene. Matches level 1's response_window_min above.
    lead_time_urgent_min: 5.0

  low_confidence:
    # LOW_CONFIDENCE is a RANK, never a deletion: the row is still returned, still
    # counted, and still carries its reasons. An alert nobody sees is an alert nobody can
    # overrule.
    #
    # It keys on INPUT quality, not on the stored confidence interval. Measured across
    # both plants, every distinct calibrated_risk maps to exactly one interval width --
    # the interval is a deterministic function of the point estimate and carries no
    # independent information, so ranking on it would double-count one number and present
    # the second copy as corroborating evidence.
    triggers: [sensor_dark_at_implicated_station, station_statistics_inferred]
    never_downgrades: critical   # a sensor problem is a reason to look harder, not less

notification_channels:
  in_app: { description: "Alert feed + toast in the active dashboard view" }
  in_app_and_sms: { description: "In-app plus SMS to the on-shift manager's ROLE alias, never a personal number" }
  in_app_and_email: { description: "In-app plus email to the plant leadership distribution list" }

shifts:
  # Three 8-hour shifts, matching configs/economics.yaml's `production.shifts_per_day: 3`.
  - id: A
    hours: "06:00-14:00"
  - id: B
    hours: "14:00-22:00"
  - id: C
    hours: "22:00-06:00"

alarm_budget:
  # Mirrors configs/economics.yaml's alarm_budget (ADR-004); repeated here because the
  # escalation policy references it directly ("what happens once budget is exhausted").
  on_budget_exhausted: "Alerts still fire and are logged, but stop pushing SMS/email --
                         only the in-app feed. Prevents alarm fatigue from becoming a
                         second, unbounded cost on top of the one already priced in
                         configs/economics.yaml's supervisor_response_cost_per_alarm."
