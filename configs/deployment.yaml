# PulseTwin — Deployment configuration
#
# The reviewable sizing/topology intent for a scaled deployment. The Kubernetes and
# Terraform manifests once written from it were never applied and were removed (ADR-054);
# the live deploy is docker-compose.prod.yml locally and render.yaml + Neon + Vercel in
# the cloud. serve/ never reads this file at runtime (CLAUDE.md SS2 bans `yaml` inside the
# import wall) -- it is read by docs/PRODUCTION_ARCHITECTURE.md / docs/SCALING_COST_MODEL.md.

services:
  backend:
    replicas:
      min: 2
      max: 6
    resources:
      requests: { cpu: "250m", memory: "192Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
    autoscaling:
      metric: cpu_utilization
      target_pct: 70
      scale_up_stabilization_s: 60
      scale_down_stabilization_s: 300
    probes:
      liveness: { path: /api/health, initial_delay_s: 15, period_s: 10 }
      readiness: { path: /api/health, initial_delay_s: 5, period_s: 5 }

  ingestion:
    replicas:
      min: 1
      max: 1     # one subscriber per broker connection; scaling this needs MQTT shared
                 # subscriptions ($share/), tracked as a backlog item, not built for the demo
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "250m", memory: "256Mi" }

  postgres:
    replicas: { min: 1, max: 1 }   # single-node for the demo; docs/PRODUCTION_ARCHITECTURE.md
                                    # calls out managed multi-AZ Postgres (RDS/Cloud SQL) for
                                    # production, not stood up here
    resources:
      requests: { cpu: "500m", memory: "512Mi" }
      limits: { cpu: "1000m", memory: "1Gi" }
    storage_gb: 20

  redis:
    replicas: { min: 1, max: 1 }
    resources:
      requests: { cpu: "100m", memory: "64Mi" }
      limits: { cpu: "250m", memory: "128Mi" }

  mqtt:
    replicas: { min: 1, max: 1 }
    resources:
      requests: { cpu: "100m", memory: "64Mi" }
      limits: { cpu: "250m", memory: "128Mi" }

network:
  # docs/PRODUCTION_ARCHITECTURE.md. Design intent: ingestion is the ONLY component that
  # reaches both mqtt (OT side) and postgres (IT side).
  ot_it_bridge_pod: ingestion
  backend_allowed_egress: [postgres, redis]
  frontend_allowed_egress: [backend]
  internet_egress_allowed: false

rollout:
  strategy: RollingUpdate
  max_surge: 1
  max_unavailable: 0

# ADR-064: dynamic simulation experiments. The reviewable source for
# serve/experiment_catalog.py::LIMITS -- serve/ cannot parse YAML (the import wall), so
# tests/test_configs.py pins the two together. Change one, change both.
simulation_experiments:
  max_scenarios: 5              # including the paired baseline
  max_seeds: 12
  max_horizon_s: 14400          # 4 simulated hours
  max_concurrent: 2
  wallclock_timeout_s: 420
  max_experiments_per_run: 3    # per originating agent run
  max_seeds_per_run: 48         # scenario-seeds, summed over a run's experiments
