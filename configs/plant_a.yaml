    zone: paint
    nominal_cycle_s: 59.0
    cycle_cv: 0.06
    buffer_capacity_after: 2
    sensor_tier: full
    sensors: [humidity_pct, temperature_c, film_thickness_um]
    mtbf_hours: 800
    repair_time_s: 740
    variant_multipliers: {sedan: 1.00, suv: 1.05, ev: 1.00}
    defect_role: mode_a_contributor
    soft_sensor_validation: true    # paint zone: ambient-driven signals, the EASY family

  - id: 18
    name: "Cure Oven"
    zone: paint
    nominal_cycle_s: 60.0
    cycle_cv: 0.04
    buffer_capacity_after: 4
    sensor_tier: full
