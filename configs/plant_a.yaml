    mtbf_hours: 1500
    repair_time_s: 500
    variant_multipliers: {sedan: 1.00, suv: 1.04, ev: 1.00}

  - id: 14
    name: "Primer Application"
    zone: paint
    nominal_cycle_s: 53.0
    cycle_cv: 0.07
    buffer_capacity_after: 5          # paint buffer entry -- Mode A dwell starts here
    sensor_tier: full
    sensors: [humidity_pct, temperature_c, film_thickness_um]
    mtbf_hours: 1000
    repair_time_s: 620
    variant_multipliers: {sedan: 1.00, suv: 1.04, ev: 1.00}

  - id: 15
    name: "Paint Surface Prep"
    zone: paint
    nominal_cycle_s: 45.0
    cycle_cv: 0.18                    # high CV: human-paced, not machine-paced
    buffer_capacity_after: 2
    sensor_tier: manual
    sensors: []
    checklist_nominal_s: 45.0         # Mode B: compresses to 20-25s on unblock burst
    mtbf_hours: 2000
    repair_time_s: 240
    variant_multipliers: {sedan: 1.00, suv: 1.06, ev: 1.00}
