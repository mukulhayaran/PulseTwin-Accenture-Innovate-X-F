  # ---------------- FINAL ASSEMBLY (S19-S30) ----------------
  - id: 19
    name: "Battery/Drivetrain Mount"
    zone: final
    nominal_cycle_s: 55.0            # x1.50 EV = 82.5s -> EV-HEAVY-DAY CONSTRAINT
    cycle_cv: 0.09
    buffer_capacity_after: 3
