    zone: body
    nominal_cycle_s: 55.0
    cycle_cv: 0.09
    buffer_capacity_after: 3
    sensor_tier: full
    sensors: [torque_nm, vibration_mm_s]
    mtbf_hours: 1100
    repair_time_s: 380
    variant_multipliers: {sedan: 1.00, suv: 1.08, ev: 1.00}

  - id: 6
    name: "Side Panel Weld"
    zone: body
    nominal_cycle_s: 57.0
    cycle_cv: 0.07
    buffer_capacity_after: 3
