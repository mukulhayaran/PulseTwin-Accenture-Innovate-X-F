    variant_multipliers: {sedan: 1.00, suv: 1.06, ev: 1.02}
    defect_role: mode_c_torque      # torque deficit here is half of the Mode C interaction

  - id: 4
    name: "Underbody Weld B"
    zone: body
    nominal_cycle_s: 52.0
    cycle_cv: 0.07
    buffer_capacity_after: 4
    sensor_tier: full
