  # ---------------- PAINT SHOP (S13-S18) ----------------
  # Canonical naming per ADR-013. Mode A dwell is measured S14 exit -> S16 entry,
  # spanning the manual S15 -- exactly the window the feature spec defines.
  - id: 13
    name: "Paint Pre-Treatment"
    zone: paint
    nominal_cycle_s: 50.0
    cycle_cv: 0.06
    buffer_capacity_after: 4
    sensor_tier: full
