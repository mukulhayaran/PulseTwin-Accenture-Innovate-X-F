variants:
  - id: sedan
    name: "Sedan"
    base_mix_pct: 50
    tuesday_mix_pct: 30
  - id: suv
    name: "SUV"
    base_mix_pct: 35
    tuesday_mix_pct: 30
  - id: ev
    name: "EV"
    base_mix_pct: 15
    tuesday_mix_pct: 40          # THE TUESDAY TRIGGER

shifts:
  - id: shift_a
    name: "Morning"
    start: "06:00"
    end: "14:00"
    operator_count: 12
    skill_distribution: {expert: 0.30, standard: 0.50, junior: 0.20}
  - id: shift_b
    name: "Afternoon"
    start: "14:00"
    end: "22:00"
    operator_count: 12
    skill_distribution: {expert: 0.20, standard: 0.50, junior: 0.30}
  - id: shift_c
    name: "Night"
    start: "22:00"
    end: "06:00"
    operator_count: 10
    skill_distribution: {expert: 0.15, standard: 0.50, junior: 0.35}

ambient:
  base_temperature_c: 24.0
  daily_amplitude_c: 6.0
  base_humidity_pct: 45.0
  humidity_high_days: [1, 2]        # Tuesday, Wednesday (0 = Monday)
  humidity_high_add_pct: 20.0
  hvac_noise_sigma_pct: 3.0

operators:
  # Skill affects torque bias and checklist thoroughness. Never surfaced individually
  # anywhere in the API or UI -- hashed to 8 buckets at featurisation (ADR-017).
  skill_torque_bias_pct: {expert: 0.5, standard: 0.0, junior: -2.5}
  skill_checklist_multiplier: {expert: 0.92, standard: 1.00, junior: 1.15}
  rotation_interval_units: 60
  operator_bucket_count: 8

defect_physics:
  # ---- Mode weights: these are the MODE BUDGET ONLY and sum to 1.0 (ADR-025) ----
  mode_a:
    name: "Paint Micro-Blistering"
    weight: 0.45
    contributing_stations: [16, 17, 18]
    dwell_window: {from_station: 14, from_edge: exit, to_station: 16, to_edge: entry}
    dwell_threshold_s: 480.0
    dwell_nominal_s: 120.0
    humidity_threshold_pct: 55.0
    paint_batch_weak_fraction: 0.30
    paint_batch_change_interval_units: 200   # LATENT -- never enters the feature matrix

  mode_b:
    name: "Surface Prep Adhesion Failure"
    weight: 0.35
    contributing_station: 15
    trigger: unblock_burst                   # ADR-026: NOT the blocked state itself
    unblock_min_blocked_s: 52.0
    rush_units_after_unblock: [4, 7]
    checklist_rush_threshold_s: 25.0
    checklist_nominal_s: 45.0

  mode_c:
    name: "Structural Fastening Defect"
    weight: 0.20
    contributing_stations: [3, 8]
    torque_deficit_threshold_pct: 8.0
    vibration_excess_percentile: 92.0
    interaction_required: true               # BOTH must co-occur; either alone is inert

  # ---- Propensity normalisation (ADR-025) ----
  # propensity = bias
  #            + mode_scale * (w_a*A + w_b*B + w_c*C)
  #            + w_lot   * incoming_lot_quality      <- UNOBSERVABLE confounder
  #            + w_noise * gaussian_noise
  # defect = logistic(propensity) > uniform(0,1)
  #
  # bias = logit(0.03) = -3.476 anchors the no-signal case at the base rate.
  # The four values below are CALIBRATED in Phase 2 to land the realised rate in
  # [2.5%, 4.0%]; fitted values are recorded in docs/ASSUMPTIONS.md.
  bias: -3.476
  mode_scale: 2.50
  w_lot: 0.80
  w_noise: 0.50

  base_defect_rate: 0.03
  lot_quality_change_interval_units: 200     # LATENT -- never enters the feature matrix

  # ---- Inspection (ADR-001) ----
  label_noise_rate: 0.03
  inspection_detection_rate: 0.92
  inspection_false_reject_rate: 0.002        # was 0.02: that made 41% of positive
                                             # labels wrong, not the claimed 3%
  inline_gate_s18: false                     # ADR-014

simulation:
  duration_days: 28                          # ADR-020 amended: whole-week splits
  seed: 42
  lot_change_interval_units: 200
  warmup_units: 200                          # discarded; line starts empty
  # WHOLE-WEEK SPLITS. The line starts on a Monday, so days 1-14 / 15-21 / 22-28 are
  # three complete weeks and EACH contains exactly one Tue/Wed peak pair. At 21 days
  # the test split was days 18-21 = Thu-Sun: no peak day at all, so it could not
  # evaluate the scenario the whole project is about, and held only 86 positives.
  train_days: [1, 14]
  validate_days: [15, 21]
  test_days: [22, 28]
  replay_window_hours: 24                    # ADR-008: station_readings scope
  tool_wear_pct_per_hour: [0.1, 0.5]         # resets after repair -> bottleneck drifts

# PROACTIVE WATCH (ADR-051). Evaluated on every live-simulation event by serve/watch.py;
# a firing starts the matching agent, which may PROPOSE an action a human approves.
# Thresholds were measured against this plant's replay stream, not assumed:
#   * tool_wear at 8.0% (= mode_c torque_deficit), against per-variant baselines baked from
#     the stream, fires on a normal run only at the Mode C station (worst 13.7% at S3,
#     next-worst 4.8%) -- those are the designed torque deficits, true positives;
#   * vibration is excluded: its rolling-8 deviation reaches ~60% on a normal run.
watch:
  window_events: 8
  cooldown_s: 3600          # simulated seconds before one detector/station re-fires
  max_open_investigations: 3   # protects the provider's daily request quota
  starvation:
    stalled_share: 0.5
  paint_env:
    humidity_excess_pct: 5.0
  tool_wear:
    signals: [torque_nm, weld_current_a]
    deviation_pct: 8.0
