# PULL-REQUEST CI: fast, deterministic, no experiments.
#
# Everything here runs against COMMITTED ARTIFACTS. Nothing in this workflow regenerates
# the simulator output, retrains a model, or runs a benchmark -- those take hours and live
# in nightly.yml. A pull request gets lint, the test suite, the artifact-provenance gates,
# and a frontend build.
#
# Determinism: OMP_NUM_THREADS=1 everywhere (ADR-016). Without it OpenMP's reduction order
# varies between runs and the "reproduces byte-for-byte" claim is false.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  OMP_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- python: lint + tests
  backend:
    name: Backend (ubuntu, py${{ matrix.python }})
    runs-on: ubuntu-latest
    # 45 was too tight to be safe. The suite trains and scores real models rather than
    # mocking them (CLAUDE.md section 5 -- that IS the coverage), and it has grown to 757
    # tests; a full local run measured 55:49. A runner is only billed for the minutes it
    # actually uses, so a ceiling well clear of the real number costs nothing and stops a
    # passing build being killed at 44:59.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the locked environment
        # --frozen: fail if uv.lock disagrees with pyproject.toml rather than silently
        # re-resolving, which would make a green run say nothing about reproducibility.
        #
        # `ingestion` is here for redis: tests/test_live_feature_parity.py imports
        # ingestion.feature_buffer, which imports redis at module scope. The test supplies
        # its own FakeRedis and needs no server -- only the library -- so installing the
        # group lets the live/offline feature-parity check actually RUN. Skipping it
        # instead would silently drop that coverage, which is the point of the file.
        run: uv sync --frozen --group dev --group ml --group ingestion --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Import wall
        # The single most load-bearing structural test in the repo (CLAUDE.md section 2).
        # Run it on its own so a violation is unmistakable in the job list.
        run: uv run pytest tests/test_serve_imports.py -q

      - name: Unit and API tests
        run: uv run pytest tests/ -q --timeout=900

  # ------------------------------------------------- provenance: artifacts vs sources
  provenance:
    name: Artifact + metric provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --group dev --group ml

      - name: Artifacts are not stale relative to their sources
        # Fails when the simulator, label generator, feature code, trainer, detector or a
        # plant config changed but the artifact was not rebuilt. Content hashes, not
        # mtimes -- see tools/verify_artifacts.py.
        run: uv run python tools/verify_artifacts.py

      - name: Documented metrics match the artifact
        # Fails when README.md says PR-AUC 0.256 and artifacts/metrics_summary.json says
        # something else. This is the gate that stops a stale number reaching a demo.
        run: |
          uv run python tools/metrics_summary.py --write
          uv run python tools/metrics_summary.py --check

      - name: metrics_summary.json is reproducible from the artifacts
        # Intent: catch a hand-edited summary. A raw `git diff` cannot express that,
        # because three parts of the file legitimately differ on every run:
        #   * generated_at  -- datetime.now() at write time;
        #   * git_sha       -- the commit being built, so it differs from the commit that
        #                      last regenerated the file, always;
        #   * any section whose inputs are gitignored (external_benchmark needs
        #     benchmark/data/, sensor_degradation needs its artifacts) degrades to
        #     "NOT RUN" in a clean checkout while the committed copy holds real results.
        # So the diff compares the METRIC CONTENT with those excluded. That still fails on
        # a hand-edited number, which is the thing worth failing on.
        run: |
          python - <<'PY'
          import json, subprocess, sys

          VOLATILE = {"generated_at", "git_sha", "elapsed_s"}
          NOT_RUN = "NOT RUN"

          def strip(node):
              if isinstance(node, dict):
                  return {k: strip(v) for k, v in node.items() if k not in VOLATILE}
              if isinstance(node, list):
                  return [strip(v) for v in node]
              return node

          head = subprocess.run(
              ["git", "show", "HEAD:artifacts/metrics_summary.json"],
              capture_output=True, text=True, check=True,
          ).stdout
          committed = strip(json.loads(head))
          with open("artifacts/metrics_summary.json", encoding="utf-8") as fh:
              regenerated = strip(json.load(fh))

          # Drop sections the checkout cannot rebuild rather than comparing a real result
          # against the NOT RUN placeholder that replaced it.
          for key, value in list(regenerated.items()):
              if isinstance(value, dict) and value.get("status") == NOT_RUN:
                  regenerated.pop(key), committed.pop(key, None)

          if committed != regenerated:
              print("::error::artifacts/metrics_summary.json is not reproducible from the "
                    "committed artifacts -- a number was hand-edited, or it was built from "
                    "artifacts other than these.")
              for k in sorted(set(committed) | set(regenerated)):
                  if committed.get(k) != regenerated.get(k):
                      print(f"  section differs: {k}")
              sys.exit(1)
          print("metrics_summary.json matches what the committed artifacts regenerate")
          PY

  # ------------------------------------------------------- python core on windows
  backend-windows:
    name: Backend core (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --group dev --group ml

      - name: Core tests
        # A SUBSET on purpose. Windows is a supported development platform for this repo
        # (it is where it was built), and two of its quirks have cost real debugging
        # sessions: CRLF corrupting stream byte offsets, and text-mode seek. Those live in
        # the simulator, scorer and artifact seams, so those are what is worth the runner
        # minutes. The full suite runs on ubuntu.
        run: >
          uv run pytest -q --timeout=900
          tests/test_simulator.py
          tests/test_scorer_parity.py
          tests/test_configs.py
          tests/test_serve_imports.py
          tests/test_dependency_manifest.py
          tests/test_bottleneck_benchmark.py

  # ------------------------------------------------------------------------- frontend
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        # `npx tsc --noEmit -p .` is this project's whole-frontend gate and it currently
        # passes clean. NOTE: ESLint is deliberately NOT configured in this repository --
        # adding it is tracked as a known limitation in docs/REQUIREMENTS.md rather than
        # bolted on here, where it would either no-op or flood a passing build.
        run: npm run typecheck

      - name: Build (static export)
        run: npm run build

      - name: Export produced the expected routes
        # A build can succeed while a route silently fails to prerender. The personas are
        # the product; assert they exist.
        run: |
          for route in index overview supervisor manager leadership ops copilot login; do
            test -f "out/$route.html" || { echo "::error::out/$route.html missing from the static export"; exit 1; }
          done
          echo "all persona routes exported"
