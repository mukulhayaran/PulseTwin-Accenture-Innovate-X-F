# Local demo. Production uses HF Spaces for the backend and Vercel for the static frontend.
services:
  backend:
    build:
      context: .
      dockerfile: serve/Dockerfile
    ports:
      - "7860:7860"
    environment:
      # Feedback is deliberately NOT written into the committed artifact database
      # (ADR-011): that DB is opened read-only so an accidental write raises loudly.
      PULSETWIN_FEEDBACK_DB: /data/pulsetwin_feedback.db
      PULSETWIN_OPS_DB: /data/pulsetwin_ops.db
    volumes:
      - demo_state:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:7860/api/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  demo_state:
